name: backend

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - name: unit tests
        working-directory: contracts/realm
        run: cargo test -- --test-threads=8
      - name: wasm size
        working-directory: contracts/realm
        run: |
          cargo build --target wasm32-unknown-unknown --release
          BYTES=$(wc -c < target/wasm32-unknown-unknown/release/realm.wasm)
          echo "wasm bytes: $BYTES"
          test "$BYTES" -lt 512000
      - name: python tables
        run: python3 -I scripts/rtp_check.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @cnc/shared test
      - run: pnpm --filter server test
      - run: pnpm --filter @cnc/sim vectors
      - run: pnpm --filter @cnc/sim sim
      - run: node scripts/e2e.mjs
