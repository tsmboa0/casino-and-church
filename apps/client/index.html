<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="theme-color" content="#14101c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "black" (opaque), not "black-translucent": iOS 26 home-screen apps with a translucent status bar get a viewport
       short by the status-bar height (WebKit bug 301108), leaving a dead strip at the bottom. The game is landscape-only,
       where iPhones hide the status bar anyway, so the opaque style costs nothing. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Casino & Church" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <title>The Casino &amp; The Church</title>
  <!-- first paint, before the game's stylesheet arrives: dark page, nothing unstyled (no white flash, no stray text) -->
  <style>html,body{margin:0;background:#14101c;color:#14101c;overflow:hidden}#ui{visibility:hidden}</style>
</head>
<body>
  <!-- painted on the very first frame (before any script, font or art loads); the game removes it when its own splash is up -->
  <div id="boot-splash" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#14101c;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.28em;text-align:center;transition:opacity .35s">
    <div style="font-weight:800;font-size:clamp(20px,5.2vw,44px);color:#ff5aa0;text-shadow:0 3px 0 #6b1530">THE CASINO</div>
    <div style="font-size:clamp(12px,2.4vw,18px);color:#f4ead5;letter-spacing:.1em">&amp;</div>
    <div style="font-weight:800;font-size:clamp(20px,5.2vw,44px);color:#f5c542;text-shadow:0 3px 0 #6b4a10">THE CHURCH</div>
    <div style="margin-top:18px;width:min(220px,50vw);height:4px;background:#2a2236;overflow:hidden;border-radius:2px"><i style="display:block;height:100%;width:40%;background:linear-gradient(90deg,#ff5aa0,#f5c542);animation:bootbar 1.1s ease-in-out infinite"></i></div>
    <div style="font-size:10px;color:#f4ead5;opacity:.55">LOADING THE WORLD</div>
    <style>@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}</style>
  </div>
  <div id="stage"><div id="game"></div></div>
  <div id="ui">
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="controls"></div>
    <div id="onboarding"></div>
    <div id="modal"></div>
    <div id="gate"></div>
    <div id="toasts"></div>
    <div id="banner"></div>
    <div id="rotate"><div class="rot-card"><div class="rot-phone"></div><p>Rotate your device</p><small>The Casino &amp; The Church is played in landscape.</small></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
