[package]
name = "realm"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Casino & The Church — NEAR testnet contract (chip ledger, commit-reveal games, church economy, plot deeds)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"

[profile.dev]
overflow-checks = true
